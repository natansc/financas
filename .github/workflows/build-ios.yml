name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Selecionar Versão do Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Compilar Projeto e Gerar XCArchive
        run: |
          cd ios/FinancasApp
          xcodebuild clean archive \
            -project FinancasApp.xcodeproj \
            -scheme FinancasApp \
            -archivePath ../../build/FinancasApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Converter XCArchive em IPA (Não Assinado)
        run: |
          mkdir -p Payload
          cp -r build/FinancasApp.xcarchive/Products/Applications/FinancasApp.app Payload/
          zip -r FinancasApp.ipa Payload
          rm -rf Payload

      - name: Disponibilizar o IPA para Download
        uses: actions/upload-artifact@v4
        with:
          name: FinancasApp-Unsigned-IPA
          path: FinancasApp.ipa