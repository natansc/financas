name: iOS Build Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Diagnostico - confirmar checkout
        run: |
          echo "=== workspace: $GITHUB_WORKSPACE ==="
          echo "=== branch/ref: $GITHUB_REF ==="
          ls -la "$GITHUB_WORKSPACE"
          echo "=== procurando ios/ ==="
          find "$GITHUB_WORKSPACE" -maxdepth 2 -iname "ios" -type d || true
          if [ ! -d "$GITHUB_WORKSPACE/ios/FinancasApp" ]; then
            echo "ERRO: $GITHUB_WORKSPACE/ios/FinancasApp nao existe apos o checkout."
            echo "Isso significa que a pasta ios/FinancasApp NAO esta commitada na branch/ref que disparou este workflow."
            exit 1
          fi
          echo "OK: ios/FinancasApp encontrado."

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar o .xcodeproj a partir do project.yml
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/ios/FinancasApp"
          xcodegen generate

      - name: Build (sem assinatura)
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/ios/FinancasApp"
          xcodebuild -project FinancasApp.xcodeproj -scheme FinancasApp \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Empacotar em .ipa
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/ios/FinancasApp"
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/FinancasApp.app Payload/
          zip -r FinancasApp.ipa Payload

      - name: Subir .ipa como artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinancasApp-ipa
          path: ios/FinancasApp/FinancasApp.ipa