name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar Projeto Xcode Automático
        run: |
          cd ios/FinancasApp
          xcodegen generate

      - name: Compilar Projeto e Gerar Archive
        run: |
          cd ios/FinancasApp
          xcodebuild clean archive \
            -project FinancasApp.xcodeproj \
            -scheme FinancasApp \
            -destination "generic/platform=iOS" \
            -archivePath ../../build/FinancasApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Converter XCArchive em IPA
        run: |
          mkdir -p Payload
          cp -r build/FinancasApp.xcarchive/Products/Applications/*.app Payload/
          zip -r FinancasApp.ipa Payload
          rm -rf Payload

      - name: Disponibilizar o IPA para Download
        uses: actions/upload-artifact@v4
        with:
          name: FinancasApp-Unsigned-IPA
          path: FinancasApp.ipa