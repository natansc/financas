name: iOS Build Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar Dependências do Node
        run: npm install

      - name: Gerar pasta iOS (Expo Prebuild)
        run: npx expo prebuild --platform ios

      - name: Instalar dependências nativas (CocoaPods)
        run: |
          cd ios
          pod install

      - name: Diagnostico - confirmar geração do iOS
        run: |
          echo "=== procurando ios/projeto_financas ==="
          if [ ! -d "$GITHUB_WORKSPACE/ios/projeto_financas" ]; then
            echo "ERRO: A pasta ios/projeto_financas nao existe apos o prebuild."
            exit 1
          fi
          echo "OK: ios/projeto_financas encontrado."

      - name: Build (sem assinatura)
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/ios"
          xcodebuild -workspace projeto_financas.xcworkspace -scheme projeto_financas \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Empacotar em .ipa
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/ios"
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/projeto_financas.app Payload/
          zip -r projeto_financas.ipa Payload

      - name: Subir .ipa como artifact
        uses: actions/upload-artifact@v4
        with:
          name: projeto_financas-ipa
          path: ios/projeto_financas.ipa