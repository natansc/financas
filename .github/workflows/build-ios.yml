name: iOS Build Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Diagnóstico - listar workspace
        run: |
          echo "GITHUB_WORKSPACE = $GITHUB_WORKSPACE"
          pwd
          find "$GITHUB_WORKSPACE/ios" -maxdepth 4 2>&1 || echo "PASTA ios/ NAO ENCONTRADA NO CHECKOUT"

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar o .xcodeproj a partir do project.yml
        working-directory: ios/FinancasApp
        run: xcodegen generate

      - name: Build (sem assinatura)
        working-directory: ios/FinancasApp
        run: |
          xcodebuild -project FinancasApp.xcodeproj -scheme FinancasApp \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Empacotar em .ipa
        working-directory: ios/FinancasApp
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/FinancasApp.app Payload/
          zip -r FinancasApp.ipa Payload

      - name: Subir .ipa como artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinancasApp-ipa
          path: ios/FinancasApp/FinancasApp.ipa