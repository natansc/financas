name: FinancasApp
options:
  bundleIdPrefix: com.financas
  deploymentTarget:
    iOS: "16.0"
targets:
  FinancasApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: FinancasApp
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.financas.FinancasApp
      GENERATE_INFOPLIST_FILE: YES
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: 1.0.0
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UIApplicationSceneManifest_GeneratesUniqueUsageKey: YES