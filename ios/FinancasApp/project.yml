name: FinancasApp
options:
  bundleIdPrefix: com.financas
  deploymentTarget:
    iOS: "17.0"
targets:
  FinancasApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: FinancasApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.financas.FinancasApp
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        AD_HOC_CODE_SIGNING_ALLOWED: YES
        SWIFT_VERSION: "5.0"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_GeneratesUniqueUsageKey: YES